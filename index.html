<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sunset</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage">
      <img class="bleed" id="frame-a" alt="" />
      <img class="bleed" id="frame-b" alt="" />
    </div>
    <div class="vision-wash" id="vision-wash" aria-hidden="true"></div>
    <svg class="vision-filters" aria-hidden="true">
      <filter id="vision-dog" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.42 0.42 0.16 0 0
                  0.38 0.38 0.12 0 0
                  0.16 0.16 0.68 0 0
                  0 0 0 1 0"
        />
        <feComponentTransfer>
          <feFuncR type="gamma" amplitude="1" exponent="0.82" offset="0.04" />
          <feFuncG type="gamma" amplitude="1" exponent="0.82" offset="0.04" />
          <feFuncB type="gamma" amplitude="1" exponent="0.82" offset="0.04" />
        </feComponentTransfer>
      </filter>
      <filter id="vision-cat" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.22 0.20 0.20 0 0
                  0.08 0.52 0.14 0 0
                  0.10 0.16 0.68 0 0
                  0 0 0 1 0"
        />
        <feComponentTransfer>
          <feFuncR type="gamma" amplitude="1" exponent="0.78" offset="0.05" />
          <feFuncG type="gamma" amplitude="1" exponent="0.78" offset="0.05" />
          <feFuncB type="gamma" amplitude="1" exponent="0.78" offset="0.05" />
        </feComponentTransfer>
      </filter>
      <filter id="vision-monarch" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="1.08 0.14 0.04 0 0
                  0.02 1.16 0.02 0 0
                  0.14 0.04 1.14 0 0.02
                  0 0 0 1 0"
        />
      </filter>
      <filter id="vision-bee" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.04 0.46 0.06 0 0
                  0.01 0.62 0.10 0 0
                  0.02 0.50 0.92 0 0
                  0 0 0 1 0"
        />
      </filter>
      <filter id="vision-bird" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="1.04 0.00 0.06 0 0
                  0.00 1.04 0.04 0 0
                  0.05 0.03 1.12 0 0.02
                  0 0 0 1 0"
        />
      </filter>
      <filter id="vision-grasshopper" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0.34 0.10 0.06 0 0
                  0.06 0.88 0.08 0 0
                  0.08 0.10 0.78 0 0.03
                  0 0 0 1 0"
        />
      </filter>
      <filter id="vision-mantis" color-interpolation-filters="sRGB">
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0.08 0.40 0.74 1" />
          <feFuncG type="discrete" tableValues="0.05 0.36 0.70 1" />
          <feFuncB type="discrete" tableValues="0.12 0.44 0.76 1" />
        </feComponentTransfer>
      </filter>
      <filter id="vision-shark" color-interpolation-filters="sRGB">
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer>
          <feFuncR type="gamma" amplitude="1" exponent="0.8" offset="0.03" />
          <feFuncG type="gamma" amplitude="1" exponent="0.8" offset="0.03" />
          <feFuncB type="gamma" amplitude="1" exponent="0.8" offset="0.03" />
        </feComponentTransfer>
        <feComponentTransfer>
          <feFuncR type="linear" slope="1.18" intercept="-0.05" />
          <feFuncG type="linear" slope="1.18" intercept="-0.05" />
          <feFuncB type="linear" slope="1.18" intercept="-0.05" />
        </feComponentTransfer>
      </filter>
      <filter id="vision-dragonfly" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="1.16 0.04 0.02 0 0
                  0.02 1.06 0.02 0 0
                  0.08 0.03 1.18 0 0.02
                  0 0 0 1 0"
        />
      </filter>
    </svg>
    <button class="arrow arrow-prev" id="prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14.5 5.5 8 12l6.5 6.5" />
      </svg>
    </button>
    <button class="arrow arrow-next" id="next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.5 5.5 16 12l-6.5 6.5" />
      </svg>
    </button>
    <p class="vision-name" id="vision-name" hidden></p>
    <div class="band">
      <button class="circle is-on" type="button" data-vision="" aria-pressed="true" aria-label="Normal vision"></button>
      <button class="circle vision-dog" type="button" data-vision="dog" aria-pressed="false" aria-label="Dog, blue, yellow, and gray" title="Dog"></button>
      <button class="circle vision-cat" type="button" data-vision="cat" aria-pressed="false" aria-label="Cat, blue, green, and yellow" title="Cat"></button>
      <button class="circle vision-monarch" type="button" data-vision="monarch" aria-pressed="false" aria-label="Monarch butterfly, ultraviolet, blue, green, and orange" title="Monarch butterfly"></button>
      <button class="circle vision-bee" type="button" data-vision="bee" aria-pressed="false" aria-label="Honey bee, reds dark, with ultraviolet, blue, and green" title="Honey bee"></button>
      <button class="circle vision-bird" type="button" data-vision="bird" aria-pressed="false" aria-label="Migratory birds, visible light and ultraviolet" title="Migratory birds"></button>
      <button class="circle vision-grasshopper" type="button" data-vision="grasshopper" aria-pressed="false" aria-label="Grasshopper, ultraviolet, blue, and green" title="Grasshopper"></button>
      <button class="circle vision-mantis" type="button" data-vision="mantis" aria-pressed="false" aria-label="Mantis shrimp, unblended colors and polarized light" title="Mantis shrimp"></button>
      <button class="circle vision-shark" type="button" data-vision="shark" aria-pressed="false" aria-label="Shark, black, white, and gray" title="Shark"></button>
      <button class="circle vision-dragonfly" type="button" data-vision="dragonfly" aria-pressed="false" aria-label="Dragonfly, ultraviolet to near infrared, polarized light" title="Dragonfly"></button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
